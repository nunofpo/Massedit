name: Build & Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'
      - 'Criar-Versao-*.bat'
      - 'Criar-Versao-*.sh'
      - 'Leame-*.txt'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag manual para a release (ex: v1.0.5). Se vazio, é gerado v1.0.<run_number>.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Compilar e Criar Release
    runs-on: windows-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Compilar Frontend (React + Vite)
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Configurar Python (3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Executar Testes Unitários
        run: |
          python -m unittest discover -s tests

      - name: Compilar Versão Portátil (PyInstaller)
        run: |
          python -m PyInstaller --noconfirm MassEdit-Portable.spec

      - name: Definir Tag da Release
        id: vars
        shell: pwsh
        run: |
          $inputTag = "${{ github.event.inputs.tag_name }}"
          if ($inputTag -and $inputTag.Trim() -ne "") {
            $TAG = $inputTag.Trim()
          } else {
            $TAG = "v1.0.${{ github.run_number }}"
          }
          Write-Host "Tag selecionada: $TAG"
          echo "tag=$TAG" >> $env:GITHUB_OUTPUT

      - name: Compactar Aplicação Portátil
        shell: pwsh
        run: |
          $TAG = "${{ steps.vars.outputs.tag }}"
          Compress-Archive -Path dist\MassEdit-Portable -DestinationPath "MassEdit-Portable.zip" -Force
          Copy-Item "MassEdit-Portable.zip" "MassEdit-Windows-Portable-$TAG.zip"
          Get-Item "MassEdit-*.zip" | Select-Object Name, Length

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: MassEdit Portable ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          files: |
            MassEdit-Portable.zip
            MassEdit-Windows-Portable-${{ steps.vars.outputs.tag }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
